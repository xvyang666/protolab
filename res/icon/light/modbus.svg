<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
    <defs>
        <!-- Background Gradient (Fluent Azure Blue) -->
        <linearGradient id="fluentBgGrad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0F6CBD"/>
            <stop offset="100%" stop-color="#004E8C"/>
        </linearGradient>

        <!-- Signal Line & Wave Gradient -->
        <linearGradient id="signalGrad" x1="20" y1="64" x2="108" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#60E2FF"/>
            <stop offset="50%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#60E2FF"/>
        </linearGradient>

        <!-- Node Gradient -->
        <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#B4E3FF"/>
        </linearGradient>

        <!-- Glass Overlay for Depth -->
        <linearGradient id="glassOverlay" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
            <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.05"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
        </linearGradient>

        <!-- Soft Fluent Shadow Filter -->
        <filter id="fluentShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#002050" flood-opacity="0.3"/>
        </filter>

        <!-- Soft Glow Filter -->
        <filter id="signalGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00C7FF" flood-opacity="0.6"/>
        </filter>
    </defs>

    <!-- Industrial Controller / Chip Base -->
    <rect x="20" y="24" width="88" height="80" rx="18" fill="url(#fluentBgGrad)" filter="url(#fluentShadow)"/>

    <!-- Glass Light Reflection Overlay -->
    <rect x="20" y="24" width="88" height="80" rx="18" fill="url(#glassOverlay)"/>

    <!-- Hardware Pins (RS-485 / Serial Interface motif) -->
    <g fill="#A6C8E0" opacity="0.85">
        <rect x="36" y="16" width="6" height="10" rx="3"/>
        <rect x="52" y="16" width="6" height="10" rx="3"/>
        <rect x="68" y="16" width="6" height="10" rx="3"/>
        <rect x="84" y="16" width="6" height="10" rx="3"/>

        <rect x="36" y="102" width="6" height="10" rx="3"/>
        <rect x="52" y="102" width="6" height="10" rx="3"/>
        <rect x="68" y="102" width="6" height="10" rx="3"/>
        <rect x="84" y="102" width="6" height="10" rx="3"/>
    </g>

    <!-- Bus Communication Lines (Master & Slaves Architecture) -->
    <path d="M 28 64 H 100" stroke="#0078D4" stroke-width="6" stroke-linecap="round"/>
    <path d="M 28 64 H 100" stroke="url(#signalGrad)" stroke-width="3" stroke-linecap="round" filter="url(#signalGlow)"/>

    <!-- Branch lines for Master & Slave Nodes -->
    <line x1="42" y1="64" x2="42" y2="42" stroke="#60E2FF" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="42" cy="40" r="5.5" fill="url(#nodeGrad)" filter="url(#signalGlow)"/>

    <line x1="64" y1="64" x2="64" y2="86" stroke="#60E2FF" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="64" cy="88" r="5.5" fill="url(#nodeGrad)" filter="url(#signalGlow)"/>

    <line x1="86" y1="64" x2="86" y2="42" stroke="#60E2FF" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="86" cy="40" r="5.5" fill="url(#nodeGrad)" filter="url(#signalGlow)"/>

    <!-- Stylized "M" Pulse Wave for Modbus Protocol -->
    <path d="M 38 64 L 46 52 L 54 68 L 64 46 L 74 68 L 82 52 L 90 64"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="3.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#signalGlow)"/>

    <!-- Status LED Indicators -->
    <circle cx="32" cy="34" r="3" fill="#107C41"/> <!-- TX/RX Green -->
    <circle cx="42" cy="34" r="3" fill="#60E2FF"/> <!-- Power/Comm Blue -->
</svg>
