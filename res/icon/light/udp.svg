<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
    <defs>
        <!-- Fluent Drop Shadows -->
        <filter id="fluent-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#001838" flood-opacity="0.25"/>
        </filter>
        <filter id="particle-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
        </filter>

        <!-- Datagram Gradient (Speed Cyan/Blue) -->
        <linearGradient id="datagramGrad" x1="64" y1="28" x2="64" y2="100" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#00A4EF"/>
            <stop offset="100%" stop-color="#00F0D0"/>
        </linearGradient>

        <!-- Text Gradient (Deep Blue to Light Blue) -->
        <linearGradient id="textGrad" x1="42" y1="44" x2="86" y2="76" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0078D4"/>
            <stop offset="100%" stop-color="#00A4EF"/>
        </linearGradient>

        <!-- Speed Line Gradients -->
        <linearGradient id="speedLinesGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#00A4EF" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#00A4EF" stop-opacity="0.1"/>
        </linearGradient>

        <!-- Particle Gradients -->
        <linearGradient id="particleGrad1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
        </linearGradient>
        <linearGradient id="particleGrad2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#00F0D0" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#00F0D0" stop-opacity="0.05"/>
        </linearGradient>

        <!-- Glass Overlay Highlight -->
        <linearGradient id="glassHighlight" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
        </linearGradient>
    </defs>

    <!-- High-Speed "UDP" Datagram Packet -->
    <g filter="url(#fluent-shadow)">
        <!-- Streamlined Rotating Rectangle -->
        <rect x="26" y="28" width="76" height="72" rx="18" fill="url(#datagramGrad)" transform="rotate(-15 64 64)"/>
        <rect x="26" y="28" width="76" height="32" rx="18" fill="url(#glassHighlight)" transform="rotate(-15 64 64)"/>

        <!-- "UDP" Text with depth -->
        <text x="64" y="74" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, sans-serif" font-weight="900" font-size="28" fill="url(#textGrad)" text-anchor="middle" letter-spacing="1">UDP</text>

        <!-- Inner Slots / Details -->
        <rect x="42" y="44" width="22" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.5" transform="rotate(-15 64 64)"/>
        <rect x="68" y="44" width="18" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.5" transform="rotate(-15 64 64)"/>
        <rect x="42" y="56" width="44" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.5" transform="rotate(-15 64 64)"/>
    </g>

    <!-- Motion Effects -->
    <!-- Speed Lines behind the packet -->
    <g stroke="url(#speedLinesGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6">
        <path d="M 10 70 C 18 64, 26 62, 34 62"/>
        <path d="M 12 78 C 22 72, 32 70, 42 70"/>
        <path d="M 16 86 C 26 80, 36 78, 46 78"/>
    </g>

    <!-- Speed and Undelivered Particles around the packet -->
    <g filter="url(#particle-shadow)">
        <!-- Large particles (Speed/Loss indication) -->
        <circle cx="106" cy="38" r="6" fill="url(#particleGrad1)" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
        <circle cx="98" cy="98" r="5" fill="url(#particleGrad1)"/>
        <circle cx="114" cy="74" r="4" fill="url(#particleGrad2)" stroke="#00F0D0" stroke-opacity="0.3" stroke-width="1.5"/>

        <!-- Smaller particles (Loss indication) -->
        <circle cx="12" cy="34" r="3" fill="url(#particleGrad2)" opacity="0.4"/>
        <circle cx="118" cy="110" r="2.5" fill="url(#particleGrad2)" opacity="0.3"/>
    </g>

    <!-- Emitting point indication (Fast burst) -->
    <circle cx="20" cy="90" r="5" fill="#00A4EF" fill-opacity="0.8" filter="url(#fluent-shadow)"/>
    <circle cx="20" cy="90" r="3" fill="#FFFFFF"/>
</svg>
