<?xml version="1.0" encoding="UTF-8"?>
<svg id="devConnectIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Main Background Gradient -->
    <linearGradient id="squircleBg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0052D4"/>
      <stop offset="50%" stop-color="#4364F7"/>
      <stop offset="100%" stop-color="#6FB1FC"/>
    </linearGradient>

    <!-- Central Node Glow Gradient -->
    <linearGradient id="coreGlowGrad" x1="200" y1="200" x2="312" y2="312" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Branch Paths Gradient (Magenta to Cyan) -->
    <linearGradient id="branchGrad" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF007A"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Specular Glass Highlight Overlay -->
    <linearGradient id="glassReflection" x1="256" y1="32" x2="256" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Depth Shadow -->
    <filter id="hubShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#003B99" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Node Core Glow Shadow -->
    <filter id="corePulse" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00F2FE" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Squircle Base Shape -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#squircleBg)" filter="url(#hubShadow)"/>

  <!-- Glass Specular Reflection Upper Arc -->
  <path d="M 144 48 H 368 C 421 48 464 91 464 144 V 240 C 464 240 336 290 256 290 C 176 290 48 240 48 240 V 144 C 48 91 91 48 144 48 Z" fill="url(#glassReflection)"/>

  <!-- Outer Light Rim Bevel -->
  <rect x="52" y="52" width="408" height="408" rx="92" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.25"/>

  <!-- 3 Protocol Branches (Serial, MQTT, TCP/UDP) merging to center node (256, 256) -->

  <!-- Branch 1: Top Right (Cloud / MQTT) -->
  <path d="M 370 142 L 256 256" stroke="url(#branchGrad)" stroke-width="22" stroke-linecap="round"/>
  <circle cx="370" cy="142" r="22" fill="#FF007A"/>
  <circle cx="370" cy="142" r="10" fill="#FFFFFF"/>

  <!-- Branch 2: Bottom Left (Serial / Hardware) -->
  <path d="M 142 370 L 256 256" stroke="url(#branchGrad)" stroke-width="22" stroke-linecap="round"/>
  <circle cx="142" cy="370" r="22" fill="#00F2FE"/>
  <circle cx="142" cy="370" r="10" fill="#FFFFFF"/>

  <!-- Branch 3: Bottom Right (Sockets TCP / UDP) -->
  <path d="M 370 370 L 256 256" stroke="url(#branchGrad)" stroke-width="22" stroke-linecap="round"/>
  <circle cx="370" cy="370" r="22" fill="#38EF7D"/>
  <circle cx="370" cy="370" r="10" fill="#FFFFFF"/>

  <!-- Central High-Luminance Convergence Core -->
  <circle cx="256" cy="256" r="44" fill="url(#coreGlowGrad)" filter="url(#corePulse)"/>
  <circle cx="256" cy="256" r="22" fill="#FFFFFF"/>
</svg>