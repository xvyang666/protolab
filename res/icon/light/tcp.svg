<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
    <defs>
        <!-- Fluent Drop Shadows -->
        <filter id="fluent-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#001838" flood-opacity="0.25"/>
        </filter>
        <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.22"/>
        </filter>

        <!-- Node 1: Fluent Blue Gradient -->
        <linearGradient id="nodeBlue" x1="14" y1="28" x2="48" y2="88" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#00A4EF"/>
            <stop offset="100%" stop-color="#005A9E"/>
        </linearGradient>

        <!-- Node 2: Fluent Cyan Gradient -->
        <linearGradient id="nodeCyan" x1="80" y1="28" x2="114" y2="88" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#00F0D0"/>
            <stop offset="100%" stop-color="#0086B0"/>
        </linearGradient>

        <!-- Stream Gradients -->
        <linearGradient id="pathGradTop" x1="44" y1="0" x2="84" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#00A4EF"/>
            <stop offset="50%" stop-color="#3CD0FF"/>
            <stop offset="100%" stop-color="#00F0D0"/>
        </linearGradient>

        <linearGradient id="pathGradBottom" x1="84" y1="0" x2="44" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#00F0D0"/>
            <stop offset="50%" stop-color="#0078D4"/>
            <stop offset="100%" stop-color="#004E8C"/>
        </linearGradient>

        <!-- TCP Badge Gradient -->
        <linearGradient id="badgeGrad" x1="39" y1="47" x2="89" y2="69" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1E293B"/>
            <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>

        <linearGradient id="badgeBorder" x1="39" y1="47" x2="89" y2="69" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="100%" stop-color="#0284C7"/>
        </linearGradient>

        <!-- Glass Overlay Highlight -->
        <linearGradient id="glassHighlight" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
        </linearGradient>
    </defs>

    <!-- Left Node (Client / Host A) -->
    <g filter="url(#fluent-shadow)">
        <rect x="14" y="28" width="34" height="60" rx="10" fill="url(#nodeBlue)"/>
        <rect x="14" y="28" width="34" height="28" rx="10" fill="url(#glassHighlight)"/>
        <!-- LED Lights & Slots -->
        <circle cx="24" cy="40" r="2.5" fill="#FFFFFF" fill-opacity="0.95"/>
        <circle cx="32" cy="40" r="2.5" fill="#7DD3FC" fill-opacity="0.95"/>
        <rect x="22" y="52" width="18" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.4"/>
        <rect x="22" y="60" width="18" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.4"/>
        <rect x="22" y="68" width="12" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.4"/>
    </g>

    <!-- Right Node (Server / Host B) -->
    <g filter="url(#fluent-shadow)">
        <rect x="80" y="28" width="34" height="60" rx="10" fill="url(#nodeCyan)"/>
        <rect x="80" y="28" width="34" height="28" rx="10" fill="url(#glassHighlight)"/>
        <!-- LED Lights & Slots -->
        <circle cx="90" cy="40" r="2.5" fill="#FFFFFF" fill-opacity="0.95"/>
        <circle cx="98" cy="40" r="2.5" fill="#A5F3FC" fill-opacity="0.95"/>
        <rect x="88" y="52" width="18" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.4"/>
        <rect x="88" y="60" width="18" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.4"/>
        <rect x="88" y="68" width="12" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.4"/>
    </g>

    <!-- Data Streams (Bidirectional Handshake Curves) -->
    <!-- Top Stream (Left -> Right) -->
    <path d="M 44 42 C 58 28, 70 28, 84 42" stroke="url(#pathGradTop)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 79 36 L 86 43 L 78 47" fill="none" stroke="#00F0D0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="64" cy="33" r="4" fill="#FFFFFF" filter="url(#badge-shadow)"/>
    <circle cx="64" cy="33" r="2" fill="#00A4EF"/>

    <!-- Bottom Stream (Right -> Left) -->
    <path d="M 84 74 C 70 88, 58 88, 44 74" stroke="url(#pathGradBottom)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 49 80 L 42 73 L 50 69" fill="none" stroke="#005A9E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="64" cy="83" r="4" fill="#FFFFFF" filter="url(#badge-shadow)"/>
    <circle cx="64" cy="83" r="2" fill="#00F0D0"/>

    <!-- Central "TCP" Protocol Badge -->
    <g filter="url(#badge-shadow)">
        <rect x="39" y="47" width="50" height="22" rx="11" fill="url(#badgeGrad)" stroke="url(#badgeBorder)" stroke-width="1.5"/>
        <text x="64" y="62" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">TCP</text>
    </g>
</svg>
